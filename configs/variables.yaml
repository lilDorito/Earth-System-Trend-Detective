# variable catalog (owners: data for IDs/units, content for names/definitions/tags)

variables:
  - key: air_temperature
    variable_id: merra2_t2m # dataset key (Hugging Face), MERRA-2 2 m air temperature on a 1 degree grid
    source: hf_grid
    name: Air temperature (2 m)
    short_definition: How warm the air is about two meters above the ground, the temperature you feel outside.
    units_raw: °C
    units: °C
    conversion: identity
    resolution: monthly
    group: atmosphere
    typical_range: [-55.2, 29.1]
    coverage_start: 2000-01-01
    land_only: false
    region_tags: [city, farmland, mountains, coast, desert, forest]

  - key: soil_moisture
    variable_id: gldas_soilmoist_0_10 # GLDAS Noah, top 10 cm
    source: hf_grid
    name: Soil moisture (top 10 cm)
    short_definition: How much water is held in the top layer of soil, which plants and crops depend on.
    units_raw: kg m-2
    units: kg/m²
    conversion: identity
    resolution: monthly
    group: land
    typical_range: [5.76, 100.0]
    coverage_start: 2000-01-01
    land_only: true
    region_tags: [farmland, forest, desert]

  - key: precipitation
    variable_id: imerg_precip # GPM IMERG Final, land and ocean, ends 2025-09
    source: hf_grid
    name: Precipitation
    short_definition: The total amount of rain and snow that falls, measured as the depth of water it would make.
    units_raw: mm/month
    units: mm/month
    conversion: identity
    resolution: monthly
    group: atmosphere
    typical_range: [0.0, 348.0]
    coverage_start: 2000-01-01
    land_only: false
    region_tags: [farmland, forest, mountains, coast, desert]

  - key: no2_column
    variable_id: TODO_VERIFY_OMNO2d_tropospheric_column # OMI tropospheric NO2
    source: mock
    name: Nitrogen dioxide (NO₂)
    short_definition: A polluting gas mostly from traffic, power plants and industry, measured in the air column above the ground.
    units_raw: molecules cm-2
    units: molecules/cm²
    conversion: identity
    resolution: monthly
    group: atmosphere
    coverage_start: 2004-10-01
    land_only: false
    region_tags: [city]

  - key: sea_surface_temperature
    variable_id: sst # NOAA OISST v2.1
    source: hf_grid
    name: Sea surface temperature
    short_definition: How warm the top layer of the ocean is; it steers weather, storms and marine life.
    units_raw: °C
    units: °C
    conversion: identity
    resolution: monthly
    group: ocean
    typical_range: [-1.79, 29.8]
    coverage_start: 2000-01-01
    land_only: false
    region_tags: [coast]

  - key: sea_level
    variable_id: sla # CMEMS DUACS sea level anomaly, shown in mm
    source: hf_grid
    name: Sea level
    short_definition: How high the sea stands compared with its long-term average, rising as oceans warm and ice melts.
    units_raw: mm
    units: mm
    conversion: identity
    resolution: monthly
    group: ocean
    typical_range: [-105.0, 234.0]
    coverage_start: 2000-01-01
    land_only: false
    region_tags: [coast]

  # atmosphere: added from the dataset catalog

  - key: surface_temperature
    variable_id: merra2_ts # Surface skin temperature (MERRA-2)
    source: hf_grid
    name: Surface skin temperature
    short_definition: "How hot the ground or sea surface itself is, which on a sunny day can be far hotter than the air."
    units_raw: degC
    units: °C
    conversion: identity # the dataset reader applies the display factor
    resolution: monthly
    group: atmosphere
    typical_range: [-58.3, 30.3]
    coverage_start: 2000-01-01
    land_only: false
    region_tags: [city, desert]

  - key: humidity
    variable_id: merra2_qv2m # 2 m specific humidity (MERRA-2)
    source: hf_grid
    name: Air humidity (2 m)
    short_definition: "How much water vapour the air near the ground holds, by weight; warmer air can hold more."
    units_raw: kg kg-1
    units: g/kg
    conversion: identity # the dataset reader applies the display factor
    resolution: monthly
    group: atmosphere
    typical_range: [0.025, 19.6]
    coverage_start: 2000-01-01
    land_only: false
    region_tags: [city, farmland, coast, forest]

  - key: water_vapour
    variable_id: merra2_tqv # Total column water vapour (MERRA-2)
    source: hf_grid
    name: Water vapour in the air column
    short_definition: "All the water vapour in the air above a place, from the ground up; it feeds rain and traps heat."
    units_raw: kg m-2
    units: kg/m²
    conversion: identity # the dataset reader applies the display factor
    resolution: monthly
    group: atmosphere
    typical_range: [0.326, 56.8]
    coverage_start: 2000-01-01
    land_only: false
    region_tags: [coast, mountains, forest]

  - key: wind_east
    variable_id: merra2_u10m # 10 m eastward wind (MERRA-2)
    source: hf_grid
    name: Eastward wind (10 m)
    short_definition: The west-to-east part of the wind 10 meters up; negative values mean the wind blows toward the west.
    units_raw: m s-1
    units: m/s
    conversion: identity # the dataset reader applies the display factor
    resolution: monthly
    group: atmosphere
    typical_range: [-7.77, 8.3]
    coverage_start: 2000-01-01
    land_only: false
    region_tags: [coast, mountains]

  - key: wind_north
    variable_id: merra2_v10m # 10 m northward wind (MERRA-2)
    source: hf_grid
    name: Northward wind (10 m)
    short_definition: The south-to-north part of the wind 10 meters up; negative values mean the wind blows toward the south.
    units_raw: m s-1
    units: m/s
    conversion: identity # the dataset reader applies the display factor
    resolution: monthly
    group: atmosphere
    typical_range: [-5.18, 6.66]
    coverage_start: 2000-01-01
    land_only: false
    region_tags: [coast, mountains]

  - key: surface_pressure
    variable_id: merra2_ps # Surface pressure (MERRA-2)
    source: hf_grid
    name: Surface pressure
    short_definition: The weight of the air above a place; it is lower in the mountains and drops when storms pass.
    units_raw: Pa
    units: hPa
    conversion: identity # the dataset reader applies the display factor
    resolution: monthly
    group: atmosphere
    typical_range: [650.0, 1020.0]
    coverage_start: 2000-01-01
    land_only: false
    region_tags: [mountains, coast]

  # land: added from the dataset catalog

  - key: soil_moisture_deep
    variable_id: gldas_soilmoist_10_40 # Soil moisture 10-40 cm (GLDAS Noah)
    source: hf_grid
    name: Soil moisture (10-40 cm)
    short_definition: "Water held deeper in the soil, where it lasts longer and carries crops through dry spells."
    units_raw: kg m-2
    units: kg/m²
    conversion: identity # the dataset reader applies the display factor
    resolution: monthly
    group: land
    typical_range: [31.1, 300.0]
    coverage_start: 2000-01-01
    land_only: true
    region_tags: [farmland, forest]

  - key: root_zone_moisture
    variable_id: gldas_rootmoist # Root-zone soil moisture (GLDAS Noah)
    source: hf_grid
    name: Root-zone soil moisture
    short_definition: All the water in the layer of soil that plant roots can reach.
    units_raw: kg m-2
    units: kg/m²
    conversion: identity # the dataset reader applies the display factor
    resolution: monthly
    group: land
    typical_range: [6.53, 718.0]
    coverage_start: 2000-01-01
    land_only: true
    region_tags: [farmland, forest, desert]

  - key: evapotranspiration
    variable_id: gldas_evap # Evapotranspiration (GLDAS Noah)
    source: hf_grid
    name: Evapotranspiration
    short_definition: "Water returning to the air from soil, lakes and plant leaves; it rises with heat and falls in drought."
    units_raw: mm/month
    units: mm/month
    conversion: identity # the dataset reader applies the display factor
    resolution: monthly
    group: land
    typical_range: [-0.00512, 141.0]
    coverage_start: 2000-01-01
    land_only: true
    region_tags: [farmland, forest]

  - key: potential_evaporation
    variable_id: gldas_potevap # Potential evaporation (GLDAS Noah)
    source: hf_grid
    name: Potential evaporation
    short_definition: "How strongly the air could dry out a wet surface, given as the energy it would take; a measure of drying power."
    units_raw: W m-2
    units: W/m²
    conversion: identity # the dataset reader applies the display factor
    resolution: monthly
    group: land
    typical_range: [0.283, 447.0]
    coverage_start: 2000-01-01
    land_only: true
    region_tags: [farmland, desert]

  - key: land_precipitation
    variable_id: gldas_precip # Precipitation (GLDAS Noah)
    source: hf_grid
    name: Precipitation over land (GLDAS)
    short_definition: "Rain and snow over land from the GLDAS land model, a second opinion next to the satellite record."
    units_raw: mm/month
    units: mm/month
    conversion: identity # the dataset reader applies the display factor
    resolution: monthly
    group: land
    typical_range: [0.0115, 310.0]
    coverage_start: 2000-01-01
    land_only: true
    region_tags: [farmland, forest, mountains]

  - key: land_air_temperature
    variable_id: gldas_tair # Near-surface air temperature (GLDAS Noah)
    source: hf_grid
    name: Air temperature over land (GLDAS)
    short_definition: "Air temperature near the ground from the GLDAS land model, a second opinion next to MERRA-2."
    units_raw: degC
    units: °C
    conversion: identity # the dataset reader applies the display factor
    resolution: monthly
    group: land
    typical_range: [-29.7, 33.1]
    coverage_start: 2000-01-01
    land_only: true
    region_tags: [farmland, mountains, forest, desert]

  - key: land_surface_temperature
    variable_id: gldas_skin_temp # Skin temperature (GLDAS Noah)
    source: hf_grid
    name: Land surface temperature
    short_definition: How hot the ground surface itself gets; cities and bare ground heat up most.
    units_raw: degC
    units: °C
    conversion: identity # the dataset reader applies the display factor
    resolution: monthly
    group: land
    typical_range: [-34.2, 35.3]
    coverage_start: 2000-01-01
    land_only: true
    region_tags: [city, desert]

  - key: snow_water
    variable_id: gldas_swe # Snow water equivalent (GLDAS Noah)
    source: hf_grid
    name: Snow water equivalent
    short_definition: "How much water is stored in the snowpack: the depth of water you would get by melting it."
    units_raw: kg m-2
    units: kg/m²
    conversion: identity # the dataset reader applies the display factor
    resolution: monthly
    group: land
    typical_range: [0.0, 16000.0]
    coverage_start: 2000-01-01
    land_only: true
    region_tags: [mountains]

  - key: snow_depth
    variable_id: gldas_snowdepth # Snow depth (GLDAS Noah)
    source: hf_grid
    name: Snow depth
    short_definition: How deep the snow lies on the ground.
    units_raw: m
    units: m
    conversion: identity # the dataset reader applies the display factor
    resolution: monthly
    group: land
    typical_range: [0.0, 61.9]
    coverage_start: 2000-01-01
    land_only: true
    region_tags: [mountains]

  - key: sunlight
    variable_id: gldas_swdown # Downward shortwave radiation (GLDAS)
    source: hf_grid
    name: Incoming sunlight
    short_definition: "How much sunlight reaches the ground; clouds, haze and smoke cut it."
    units_raw: W m-2
    units: W/m²
    conversion: identity # the dataset reader applies the display factor
    resolution: monthly
    group: land
    typical_range: [0.0105, 321.0]
    coverage_start: 2000-01-01
    land_only: true
    region_tags: [farmland, desert, city]

  - key: land_wind_speed
    variable_id: gldas_wind # Wind speed (GLDAS forcing)
    source: hf_grid
    name: Wind speed over land
    short_definition: How fast the wind blows near the ground over land.
    units_raw: m s-1
    units: m/s
    conversion: identity # the dataset reader applies the display factor
    resolution: monthly
    group: land
    typical_range: [1.04, 6.42]
    coverage_start: 2000-01-01
    land_only: true
    region_tags: [coast, mountains, desert]

  # ocean: added from the dataset catalog

  - key: sea_ice
    variable_id: sea_ice_conc # Sea ice concentration (NOAA/NSIDC CDR)
    source: hf_grid
    name: Sea ice cover
    short_definition: The share of the sea surface covered by ice; it shrinks as the polar oceans warm.
    units_raw: fraction 0-1
    units: "%"
    conversion: identity # the dataset reader applies the display factor
    resolution: monthly
    group: ocean
    typical_range: [0.0, 100.0]
    coverage_start: 2000-01-01
    coverage_end: 2024-12-31
    land_only: false
    region_tags: [coast]

  - key: sea_surface_salinity
    variable_id: sss # Sea surface salinity, ~5 m level (EN4)
    source: hf_grid
    name: Sea surface salinity
    short_definition: "How salty the top of the ocean is; rain and rivers freshen it, evaporation makes it saltier."
    units_raw: psu
    units: psu
    conversion: identity # the dataset reader applies the display factor
    resolution: monthly
    group: ocean
    typical_range: [26.3, 37.1]
    coverage_start: 2000-01-01
    land_only: false
    region_tags: [coast]

  - key: salinity_700m
    variable_id: sal_0_700 # Mean salinity 0-700 m (EN4)
    source: hf_grid
    name: Ocean salinity (top 700 m)
    short_definition: "The average saltiness of the upper 700 meters of the ocean, which drives how waters sink and mix."
    units_raw: psu
    units: psu
    conversion: identity # the dataset reader applies the display factor
    resolution: monthly
    group: ocean
    typical_range: [33.8, 36.3]
    coverage_start: 2000-01-01
    land_only: false
    region_tags: [coast]

  - key: ocean_heat_700m
    variable_id: ohc_0_700 # Ocean heat content 0-700 m relative to 0 degC (EN4)
    source: hf_grid
    name: Ocean heat content (top 700 m)
    short_definition: "The heat stored in the upper 700 meters of the ocean, where most of the extra heat from global warming ends up."
    units_raw: J/m2
    units: GJ/m²
    conversion: identity # the dataset reader applies the display factor
    resolution: monthly
    group: ocean
    typical_range: [-0.885, 47.7]
    coverage_start: 2000-01-01
    land_only: false
    region_tags: [coast]

  - key: ocean_heat_2000m
    variable_id: ohc_0_2000 # Ocean heat content 0-2000 m relative to 0 degC (EN4)
    source: hf_grid
    name: Ocean heat content (top 2000 m)
    short_definition: "The heat stored in the upper 2000 meters of the ocean, including heat that has sunk below the surface layers."
    units_raw: J/m2
    units: GJ/m²
    conversion: identity # the dataset reader applies the display factor
    resolution: monthly
    group: ocean
    typical_range: [-2.15, 80.4]
    coverage_start: 2000-01-01
    land_only: false
    region_tags: [coast]

  - key: ocean_ph
    variable_id: ph # Surface ocean pH (OceanSODA-ETHZ)
    source: hf_grid
    name: Ocean pH
    short_definition: "How acidic the surface ocean is; it drops as the sea absorbs CO₂, which makes life harder for shells and corals."
    units_raw: pH total scale
    units: pH
    conversion: identity # the dataset reader applies the display factor
    resolution: monthly
    group: ocean
    typical_range: [7.99, 8.15]
    coverage_start: 2000-01-01
    coverage_end: 2024-12-31
    land_only: false
    region_tags: [coast]

  - key: ocean_pco2
    variable_id: pco2 # Surface ocean pCO2 (OceanSODA-ETHZ)
    source: hf_grid
    name: CO₂ in surface seawater
    short_definition: "How much carbon dioxide the surface ocean holds, given as its pressure; it climbs with CO₂ in the air."
    units_raw: uatm
    units: µatm
    conversion: identity # the dataset reader applies the display factor
    resolution: monthly
    group: ocean
    typical_range: [289.0, 462.0]
    coverage_start: 2000-01-01
    coverage_end: 2024-12-31
    land_only: false
    region_tags: [coast]

  - key: chlorophyll
    variable_id: chlor_a # Chlorophyll-a, geometric mean (NASA MODIS-Aqua)
    source: hf_grid
    name: Chlorophyll (ocean plankton)
    short_definition: "The green pigment of tiny ocean plants; more of it means more plankton, the base of the marine food web."
    units_raw: mg/m3
    units: mg/m³
    conversion: identity # the dataset reader applies the display factor
    resolution: monthly
    group: ocean
    typical_range: [0.0213, 9.02]
    coverage_start: 2002-07-01
    land_only: false
    region_tags: [coast]

  - key: ocean_mass
    variable_id: ocean_mass # Ocean mass, liquid water equivalent (GRACE/GRACE-FO JPL)
    source: hf_grid
    name: Ocean mass (GRACE)
    short_definition: "Changes in the weight of water over the sea floor, measured by gravity satellites, as centimeters of water."
    units_raw: cm LWE
    units: cm
    conversion: identity # the dataset reader applies the display factor
    resolution: monthly
    group: ocean
    typical_range: [-5.53, 9.6]
    coverage_start: 2002-04-01
    land_only: false
    region_tags: [coast]
